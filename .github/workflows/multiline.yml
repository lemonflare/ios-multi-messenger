name: Build MultiLine

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted LINE IPA file"
        required: true
        type: string

      app_suffix:
        description: "App suffix (e.g., '2' for LINE2)"
        required: true
        type: string
        default: "2"

      display_name:
        description: "Display name (e.g., 'LINE2')"
        required: true
        type: string
        default: "LINE2"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_multiline:
    name: Build MultiLine IPA
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and validate IPA
        run: |
          if [ -z "${{ github.event.inputs.ipa_url }}" ]; then
            echo "::error::IPA URL is required"
            exit 1
          fi

          wget "${{ github.event.inputs.ipa_url }}" --no-verbose -O input.ipa

          file_type=$(file --mime-type -b input.ipa)
          echo "File type: $file_type"

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Extract IPA
        run: |
          unzip -q input.ipa
          APP=$(find Payload -name "*.app" -type d | head -n 1)
          echo "APP_NAME=$APP" >> "$GITHUB_ENV"
          echo "App found: $APP"


      - name: Modify Info.plist
        run: |
          APP="${{ env.APP_NAME }}"
          INFO="$APP/Info.plist"
          SUFFIX="${{ github.event.inputs.app_suffix }}"
          DISPLAY="${{ github.event.inputs.display_name }}"

          # Make Info.plist writable
          chmod u+w "$INFO"

          # Use Python script to modify plist
          python3 scripts/modify_plist.py "$INFO" "$SUFFIX" "$DISPLAY"

          # Modify URL schemes - add suffix to LINE schemes
          python3 scripts/modify_url_schemes.py "$INFO" "$SUFFIX" "line,re,line1,line2,line3,line4,line5"
      - name: Modify InfoPlist.strings
        run: |
          APP="${{ env.APP_NAME }}"
          DISPLAY="${{ github.event.inputs.display_name }}"

          for lang_dir in "$APP"/*.lproj; do
            if [ -f "$lang_dir/InfoPlist.strings" ]; then
              echo "Modifying $lang_dir/InfoPlist.strings"

              # Modify CFBundleDisplayName
              python3 scripts/modify_strings.py "$lang_dir/InfoPlist.strings" "CFBundleDisplayName" "$DISPLAY"

              # Modify CFBundleName if it exists
              python3 scripts/modify_strings.py "$lang_dir/InfoPlist.strings" "CFBundleName" "$DISPLAY" || true
            fi
          done

      - name: Remove unnecessary folders
        run: |
          APP="${{ env.APP_NAME }}"

          # Remove Watch folder if exists
          if [ -d "$APP/Watch" ]; then
            echo "Removing Watch folder"
            rm -rf "$APP/Watch"
          fi

          # Remove PlugIns folder if exists
          if [ -d "$APP/PlugIns" ]; then
            echo "Removing PlugIns folder"
            rm -rf "$APP/PlugIns"
          fi

      - name: Build MultiLineFix.dylib
        run: |
          XCODE_PROJ="multilinefix-main/multilinefix-main/MultiLineFix.xcodeproj"

          if [ ! -d "$XCODE_PROJ" ]; then
            echo "::error::Xcode project not found at $XCODE_PROJ"
            exit 1
          fi

          # Build for iOS (arm64)
          xcodebuild -project "$XCODE_PROJ" \
            -scheme MultiLineFix \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

          # Find and copy the built framework binary
          FRAMEWORK_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "MultiLineFix.framework" -type d | head -n 1)

          if [ -z "$FRAMEWORK_PATH" ]; then
            echo "::error::MultiLineFix.framework not found in build output"
            exit 1
          fi

          echo "Found framework at: $FRAMEWORK_PATH"

          # Copy the framework binary as dylib
          mkdir -p Dylibs
          cp "$FRAMEWORK_PATH/MultiLineFix" Dylibs/MultiLineFix.dylib
          echo "Built dylib: Dylibs/MultiLineFix.dylib"
          file Dylibs/MultiLineFix.dylib

      - name: Inject dylib using optool
        run: |
          APP="${{ env.APP_NAME }}"
          BINARY="$APP/$(basename "$APP" .app)"
          DYLIB_PATH="Dylibs/MultiLineFix.dylib"

          # Download optool
          wget https://github.com/alexzielenski/optool/releases/download/0.1.1/optool.zip -O optool.zip
          unzip -q optool.zip
          chmod +x optool

          # Copy dylib to app bundle
          mkdir -p "$APP/Dylibs"
          cp "$DYLIB_PATH" "$APP/Dylibs/MultiLineFix.dylib"

          # Inject dylib
          ./optool install -c load -p "@executable_path/Dylibs/MultiLineFix.dylib" -t "$BINARY"

          echo "Dylib injected successfully"

      - name: Apply entitlements
        run: |
          APP="${{ env.APP_NAME }}"
          BINARY="$APP/$(basename "$APP" .app)"
          SUFFIX="${{ github.event.inputs.app_suffix }}"

          # Get bundle ID
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")

          # Generate entitlements
          cat > /tmp/entitlements.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>MV5A7FG3T2.$(echo $BUNDLE_ID | sed 's/.*\.//')</string>
              <key>com.apple.developer.team-identifier</key>
              <string>MV5A7FG3T2</string>
              <key>get-task-allow</key>
              <true/>
              <key>keychain-access-groups</key>
              <array>
                  <string>MV5A7FG3T2.*</string>
              </array>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.$(echo $BUNDLE_ID | sed 's/.*\.//')</string>
              </array>
          </dict>
          </plist>
          EOF

          # Apply entitlements with ldid
          brew install ldid
          ldid -S/tmp/entitlements.xml "$BINARY"

          echo "Entitlements applied"

      - name: Create IPA
        run: |
          OUTPUT_NAME="${{ github.event.inputs.display_name }}.ipa"
          zip -qr "$OUTPUT_NAME" Payload
          echo "Created IPA: $OUTPUT_NAME"
          ls -lh "$OUTPUT_NAME"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: multiline-${{ github.event.inputs.app_suffix }}-${{ github.run_number }}
          name: MultiLine${{ github.event.inputs.app_suffix }} (${{ github.run_number }})
          files: ${{ github.event.inputs.display_name }}.ipa
          body: |
            ## MultiLine${{ github.event.inputs.app_suffix }} IPA

            ### Configuration
            - Display name: ${{ github.event.inputs.display_name }}
            - App suffix: ${{ github.event.inputs.app_suffix }}

            ### Features
            - Multi-instance support for LINE
            - Keychain access group separation
            - App group separation
            - URL scheme separation to prevent conflicts

            ### Installation
            1. Download AltStore or SideStore
            2. Install this IPA
            3. You can now use this alongside the original LINE app

            ### Notes
            - This is for educational purposes only
            - This project does not provide decrypted IPA files
            - Users are responsible for complying with LINE's Terms of Service
            - This modified app may not receive official updates
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release created"
          echo "::notice::Download at: https://github.com/${{ github.repository }}/releases/tag/multiline-${{ github.event.inputs.app_suffix }}-${{ github.run_number }}"
